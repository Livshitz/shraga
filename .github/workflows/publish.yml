name: Publish to npm

# Publishes to public npm on every push to main.
# The npm token is NOT stored per-repo — it's fetched at publish time from the bodify
# secrets store, the one place every repo of ours reads its publishing credential from.
# Only the store's credential lives in a GitHub secret (BODIFY_API_KEY); no token and no
# endpoint credential is written in this file, so it's safe in a public repo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # push the version-bump commit + tag

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Same headroom the CI workflow gives the real-timer scheduler tests on a shared runner —
      # the two workflows run the SAME suite, so they must run it under the same knobs.
      - run: bun run test
        env:
          SCHED_TEST_SCALE: '4'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore(release): v$(node -p "require('./package.json').version") [skip ci]"
          git tag -a "v$(node -p "require('./package.json').version")" -m "v$(node -p "require('./package.json').version")"

      # Fetch the npm token from the bodify secrets store at publish time — the SAME source every
      # other repo of ours publishes from, so rotating the token in ONE place fixes them all. A
      # per-repo NPM_TOKEN copy goes stale silently and every publish then dies on a 404 (npm
      # returns 404, not 403, for a token that cannot see the package — it reads as "no such
      # package"). The only GitHub secret this needs is BODIFY_API_KEY.
      - name: Fetch npm token from bodify secrets store
        env:
          BODIFY_API_KEY: ${{ secrets.BODIFY_API_KEY }}
        run: |
          token=$(curl -sS -f -H "Authorization: Bearer $BODIFY_API_KEY" \
            "https://bodify.bod.ee/api/apps/9ddba0fb-03bc-4490-8577-5e094b5b6792/env/NPM_TOKEN?environment=prod" \
            | jq -r '.value')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Failed to fetch NPM_TOKEN from the bodify secrets store"; exit 1
          fi
          # Load-bearing: without the mask the token can be echoed into a public run log.
          echo "::add-mask::$token"
          # Fail loudly HERE on a dead token, rather than letting npm report it as a 404 on the
          # package — the misreading that cost a release cycle.
          who=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            https://registry.npmjs.org/-/whoami)
          if [ "$who" != "200" ]; then
            echo "::error::NPM_TOKEN in bodify is not valid (npm whoami -> HTTP $who). Rotate it there."; exit 1
          fi
          echo "NODE_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}

      # REBASE before pushing. Without it, a commit landing on main during this ~2min run makes the
      # branch push non-fast-forward and it is REJECTED — but `--follow-tags` had already pushed the
      # tag, so main kept the old version while the tag existed. Every later run then bumped to the
      # SAME number and died at `git tag` ("tag v0.1.75 already exists"), silently stopping releases
      # for two runs. Rebasing the release commit makes it land instead.
      - name: Push commit + tag
        run: |
          git pull --rebase origin main
          git push --follow-tags
