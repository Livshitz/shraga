name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # PINNED. setup-bun defaults to the latest release, so the toolchain changes under a
      # commit that did not touch it: 2026-09-08, bun 1.4.2 landed mid-afternoon and turned a
      # green suite red with 52 cross-file failures (`Expected a Response object, but received
      # 'Response {...}'`) that reproduced on no developer machine. Bump this deliberately.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # A shared GitHub runner is slower and noisier than any dev machine, and these scheduler
      # tests drive real timers. Stretch their waits AND the scheduler's own delay knobs by the
      # same factor so the ratios stay identical — headroom, not changed behaviour.
      - run: bun run test
        env:
          SCHED_TEST_SCALE: '4'
